[project]
name = "boozer"
version = "0.1.0"
description = "TUI for browsing Homebrew formulae you installed yourself, with an extended detail panel, disk-usage summary, and a 'how is this best served?' command cheat-sheet."
readme = "README.md"
authors = [
    { name = "n3xus", email = "n3xus@local" }
]
requires-python = ">=3.14"
dependencies = [
    "orjson>=3.12.0",
    "textual>=8.2.8",
]

[project.scripts]
boozer = "boozer.app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
